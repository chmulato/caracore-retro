name: Publicar artigo 149 no Facebook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisao:
    if: github.ref == 'refs/heads/master' && github.run_attempt == 1
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.preview.outputs.digest }}
      when: ${{ steps.preview.outputs.when }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - id: preview
        name: Conferir conteudo publicado e apresentar a chamada
        run: python -m tools.facebook_publish_article_149 preview

  publicar:
    needs: revisao
    if: github.ref == 'refs/heads/master' && github.run_attempt == 1
    environment: facebook
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    env:
      PUBLISH_AT: ${{ needs.revisao.outputs.when }}
      APPROVED_DIGEST: ${{ needs.revisao.outputs.digest }}
      FACEBOOK_REVIEWER_ID: ${{ vars.FACEBOOK_REVIEWER_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Confirmar aprovacao, reservar e publicar uma vez
        run: python -m tools.facebook_publish_article_149 publicar
