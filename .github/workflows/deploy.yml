name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  schedule:
    - cron: "30 7 30 11 *"
      timezone: "America/Sao_Paulo"
    - cron: "30 7 3,8,12,18,20,25,30 12 *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:
    inputs:
      article:
        description: "Numero do artigo para publicar (latest = mais recente; vazio = diff do push)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate blog before publishing
        run: python tools/validate_site.py

  deploy:
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-linkedin:
    needs: deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Publish new articles to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          PUBLISH_ARTICLE: ${{ inputs.article }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            if [[ -z "$LINKEDIN_ACCESS_TOKEN" || -z "$LINKEDIN_AUTHOR_URN" ]]; then
              echo "::error::LinkedIn secrets are required for scheduled publication."
              exit 1
            fi
            python tools/publish_linkedin.py --due-today
            exit $?
          fi
          case "$PUBLISH_ARTICLE" in
            "") python tools/publish_linkedin.py ;;
            latest) python tools/publish_linkedin.py --latest ;;
            *) python tools/publish_linkedin.py --article "$PUBLISH_ARTICLE" ;;
          esac

      - name: Commit publication ledger
        if: always()
        run: |
          if git diff --quiet -- linkedin_published.json; then
            echo "Publication ledger unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add linkedin_published.json
          git commit -m "chore: registra publicacoes no LinkedIn [skip ci]"
          git push
