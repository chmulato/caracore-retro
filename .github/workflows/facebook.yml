name: Revisão de campanha para Facebook

on:
  schedule:
    - cron: "0 6 * * 2,4"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:
    inputs:
      preencher_janela:
        description: "Preencher a janela movel de agendamentos aprovados"
        required: false
        default: false
        type: boolean
      article:
        description: "Número do artigo"
        required: false
        type: string
      page:
        description: "Identificador numérico da página"
        required: false
        type: string
      when:
        description: "Data e hora de São Paulo: AAAA-MM-DDTHH:MM"
        required: false
        type: string
      message:
        description: "Chamada para o Facebook; deixe vazia para receber uma sugestão"
        required: false
        type: string

permissions:
  contents: read

jobs:
  repeticao:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt != 1
    runs-on: ubuntu-latest
    steps:
      - name: Esta repetição não agenda nem publica
        run: |
          echo "Tentativa número ${GITHUB_RUN_ATTEMPT} desta execução."
          echo "Por proteção, só a primeira tentativa vale: a aprovação antiga expira junto com a prévia."
          echo "Gere uma execução nova em Actions > Revisão de campanha para Facebook > Run workflow."
          exit 1

  revisao:
    if: github.event_name == 'workflow_dispatch' && inputs.preencher_janela != true && github.ref == 'refs/heads/master' && github.run_attempt == 1
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.preview.outputs.digest }}
    env:
      ARTICLE_NUMBER: ${{ inputs.article }}
      FACEBOOK_PAGE_ID: ${{ inputs.page }}
      PUBLISH_AT: ${{ inputs.when }}
      FACEBOOK_MESSAGE: ${{ inputs.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - id: preview
        name: Apresentar conteúdo e identificação para revisão
        run: python -m tools.facebook_campaign preview

  agendamento:
    needs: revisao
    environment: facebook
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    env:
      ARTICLE_NUMBER: ${{ inputs.article }}
      FACEBOOK_PAGE_ID: ${{ inputs.page }}
      PUBLISH_AT: ${{ inputs.when }}
      FACEBOOK_MESSAGE: ${{ inputs.message }}
      APPROVED_DIGEST: ${{ needs.revisao.outputs.digest }}
      FACEBOOK_REVIEWER_ID: ${{ vars.FACEBOOK_REVIEWER_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Conferir aprovação e reservar antes de agendar
        run: python -m tools.facebook_campaign agendar

  automatico:
    if: >-
      github.ref == 'refs/heads/master' &&
      github.run_attempt == 1 &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.preencher_janela == true))
    environment: facebook-auto
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      FACEBOOK_FILL_WINDOW: ${{ inputs.preencher_janela }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Preencher a janela movel de agendamentos da Meta
        run: python -m tools.facebook_campaign preencher-janela
