name: Diagnóstico Facebook — somente leitura

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    if: github.ref == 'refs/heads/master' && github.run_attempt == 1
    environment: facebook
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Consultar identidade sem agendar nem publicar
        env:
          FACEBOOK_PAGE_ID: "1657316127663973"
          FACEBOOK_REVIEWER_ID: ${{ vars.FACEBOOK_REVIEWER_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: python -m tools.facebook_campaign diagnosticar
